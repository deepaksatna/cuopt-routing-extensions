<svg xmlns="http://www.w3.org/2000/svg" width="680" height="400" viewBox="0 0 680 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Native sparse fully feasible: memory saving grows with N — 8x at 250 stops (+1.9% gap), 12x at 500 (+3.2%), 20x at 1000 (+1.8%).">
  <rect x="0.5" y="0.5" width="679" height="399" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="38" font-size="19" font-weight="700" fill="#1f2328">Native sparse — fully feasible, saving grows with N</text>
  <text x="28" y="59" font-size="12.5" fill="#656d76">measured (H200, cuOpt 26.10.00): sparse cost core + missing-arc→infeasibility fix · gap vs dense in labels</text>

  <!-- y axis: memory saving 0..24x, baseline y=320, scale 11 px per x -->
  <line x1="90" y1="320" x2="610" y2="320" stroke="#d0d7de"/>
  <g font-size="11" fill="#8b949e" text-anchor="end">
    <line x1="90" y1="320" x2="610" y2="320" stroke="#eaeef2"/>
    <line x1="90" y1="265" x2="610" y2="265" stroke="#eaeef2"/><text x="82" y="269">5×</text>
    <line x1="90" y1="210" x2="610" y2="210" stroke="#eaeef2"/><text x="82" y="214">10×</text>
    <line x1="90" y1="155" x2="610" y2="155" stroke="#eaeef2"/><text x="82" y="159">15×</text>
    <line x1="90" y1="100" x2="610" y2="100" stroke="#eaeef2"/><text x="82" y="104">20×</text>
  </g>
  <text x="34" y="200" font-size="12" fill="#656d76" transform="rotate(-90 34 200)" text-anchor="middle">GPU-memory saving (×)</text>

  <!-- bars: n=250 -> 8x(y=232), n=500 -> 12x(y=188), n=1000 -> 20x(y=100) ; baseline 320 -->
  <g>
    <rect x="150" y="232" width="90" height="88" rx="3" fill="#1a7f37"/>
    <text x="195" y="224" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">8×</text>
    <text x="195" y="340" font-size="12" fill="#1f2328" text-anchor="middle">n=250, K=30</text>
    <text x="195" y="356" font-size="11.5" fill="#1a7f37" text-anchor="middle">FEASIBLE +1.9%</text>

    <rect x="300" y="188" width="90" height="132" rx="3" fill="#1a7f37"/>
    <text x="345" y="180" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">12×</text>
    <text x="345" y="340" font-size="12" fill="#1f2328" text-anchor="middle">n=500, K=40</text>
    <text x="345" y="356" font-size="11.5" fill="#1a7f37" text-anchor="middle">FEASIBLE +3.2%</text>

    <rect x="450" y="100" width="90" height="220" rx="3" fill="#1a7f37"/>
    <text x="495" y="92" font-size="15" font-weight="700" fill="#1a7f37" text-anchor="middle">20×</text>
    <text x="495" y="340" font-size="12" fill="#1f2328" text-anchor="middle">n=1000, K=50</text>
    <text x="495" y="356" font-size="11.5" fill="#1a7f37" text-anchor="middle">FEASIBLE +1.8%</text>
  </g>

  <text x="28" y="384" font-size="11.5" fill="#656d76">K/N shrinks 0.12 → 0.08 → 0.05 as N grows, so the O(N·K) vs O(N²) saving keeps increasing. Read path adds no lookup overhead.</text>
</svg>
