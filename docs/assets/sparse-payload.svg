<svg xmlns="http://www.w3.org/2000/svg" width="760" height="400" viewBox="0 0 760 400" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="API payload vs stops, log scale: dense JSON matrix crosses the 2 GB wall near 7,700 stops; Option A (coordinates) stays a few KB.">
  <rect x="0.5" y="0.5" width="759" height="399" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="38" font-size="19" font-weight="700" fill="#1f2328">Feature 4 — API payload vs stops (Option A removes the wall)</text>
  <text x="28" y="59" font-size="12.5" fill="#656d76">dense JSON matrix (~36·N²) vs Option A coordinates (8·N) · log scale · H200 · cuOpt 26.10.00</text>

  <!-- plot area: x 90..620, y 60..300 ; log-y decades 1KB(10^3)..10GB(10^10), 34.3 px/decade -->
  <!-- gridlines -->
  <line x1="90" y1="300" x2="620" y2="300" stroke="#eaeef2"/>
  <text x="82" y="304" font-size="11" fill="#8b949e" text-anchor="end">1 KB</text>
  <line x1="90" y1="197" x2="620" y2="197" stroke="#eaeef2"/>
  <text x="82" y="201" font-size="11" fill="#8b949e" text-anchor="end">1 MB</text>
  <line x1="90" y1="94" x2="620" y2="94" stroke="#eaeef2"/>
  <text x="82" y="98" font-size="11" fill="#8b949e" text-anchor="end">1 GB</text>

  <!-- 2 GB wall -->
  <line x1="90" y1="83" x2="620" y2="83" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="616" y="78" font-size="11" font-weight="700" fill="#9a6700" text-anchor="end">2 GB API payload wall</text>

  <!-- x labels -->
  <g font-size="11" fill="#656d76" text-anchor="middle">
    <text x="130" y="318">500</text>
    <text x="250" y="318">2,500</text>
    <text x="370" y="318">5,000</text>
    <text x="490" y="318">7,500</text>
    <text x="610" y="318">10,000</text>
  </g>
  <text x="355" y="340" font-size="12" fill="#656d76" text-anchor="middle">stops</text>

  <!-- dense JSON payload (orange, rising through the wall) -->
  <polyline fill="none" stroke="#bc4c00" stroke-width="2.5" points="130,164 250,116 370,96 490,84 610,75"/>
  <g fill="#bc4c00">
    <circle cx="130" cy="164" r="4"/><circle cx="250" cy="116" r="4"/><circle cx="370" cy="96" r="4"/>
    <circle cx="490" cy="84" r="4"/><circle cx="610" cy="75" r="4"/>
  </g>
  <text x="470" y="76" font-size="11" font-weight="700" fill="#bc4c00" text-anchor="end">2.02 GB @ 7.5k → FAILS</text>

  <!-- Option A payload (blue, flat and tiny) -->
  <polyline fill="none" stroke="#0969da" stroke-width="2.5" points="130,279 250,255 370,245 490,239 610,235"/>
  <g fill="#0969da">
    <circle cx="130" cy="279" r="4"/><circle cx="250" cy="255" r="4"/><circle cx="370" cy="245" r="4"/>
    <circle cx="490" cy="239" r="4"/><circle cx="610" cy="235" r="4"/>
  </g>
  <text x="610" y="252" font-size="11" font-weight="700" fill="#0969da" text-anchor="end">58.6 KB @ 7.5k → solves</text>

  <!-- legend -->
  <rect x="96" y="352" width="14" height="10" rx="2" fill="#bc4c00"/>
  <text x="116" y="361" font-size="12" fill="#1f2328">Dense JSON matrix (~36·N²) — hits 2 GB wall at N ≈ 7,700</text>
  <rect x="440" y="352" width="14" height="10" rx="2" fill="#0969da"/>
  <text x="460" y="361" font-size="12" fill="#1f2328">Option A: coordinates (8·N) — a few KB</text>

  <text x="28" y="386" font-size="11.5" fill="#656d76">At 7,500 stops Option A transmits 33,750× less than the dense matrix and solves where the dense payload fails.</text>
</svg>
