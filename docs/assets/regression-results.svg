<svg xmlns="http://www.w3.org/2000/svg" width="780" height="360" viewBox="0 0 780 360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="cuOpt routing regression and EV validation results: 192 tests run, 191 passing, 1 documented, 1 pre-existing.">
  <!-- self-contained card: legible on GitHub light and dark themes -->
  <rect x="0.5" y="0.5" width="779" height="359" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#1f2328">cuOpt Routing — Regression &amp; EV Validation</text>
  <text x="28" y="62" font-size="13" fill="#656d76">from-source build · cuOpt 26.10.00 · NVIDIA H200 · no solver-core changes</text>

  <!-- stat tiles -->
  <g>
    <!-- tile 1 -->
    <rect x="28" y="84" width="172" height="90" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="44" y="140" font-size="38" font-weight="700" fill="#1f2328">192</text>
    <text x="44" y="162" font-size="12.5" fill="#656d76">tests run</text>
    <!-- tile 2 -->
    <rect x="212" y="84" width="172" height="90" rx="8" fill="#dafbe1" stroke="#a2e6b0"/>
    <text x="228" y="140" font-size="38" font-weight="700" fill="#1a7f37">191</text>
    <text x="228" y="162" font-size="12.5" fill="#1a7f37">passing · 99.5%</text>
    <!-- tile 3 -->
    <rect x="396" y="84" width="172" height="90" rx="8" fill="#fff8c5" stroke="#eac54f"/>
    <text x="412" y="140" font-size="38" font-weight="700" fill="#9a6700">1</text>
    <text x="412" y="162" font-size="12.5" fill="#9a6700">documented · multi-cycle</text>
    <!-- tile 4 -->
    <rect x="580" y="84" width="172" height="90" rx="8" fill="#f6f8fa" stroke="#d0d7de"/>
    <text x="596" y="140" font-size="38" font-weight="700" fill="#656d76">1</text>
    <text x="596" y="162" font-size="12.5" fill="#656d76">pre-existing · not this work</text>
  </g>

  <!-- enhancement impact: before/after on the Python routing suite -->
  <text x="28" y="212" font-size="14" font-weight="700" fill="#1f2328">Enhancement impact — full Python routing suite (87 tests)</text>

  <!-- scale: total 87 -> 470px, x 210..680, 5.402 px/test -->
  <!-- before -->
  <text x="28" y="245" font-size="12.5" fill="#656d76">before</text>
  <rect x="210" y="230" width="454" height="20" rx="3" fill="#eaeef2"/>
  <rect x="210" y="230" width="454" height="20" rx="3" fill="#afb8c1"/>            <!-- 84 pass -->
  <rect x="666" y="230" width="16"  height="20" rx="3" fill="#d1a000"/>            <!-- 3 fail -->
  <text x="220" y="244" font-size="12" font-weight="700" fill="#ffffff">84 passed</text>
  <text x="690" y="244" font-size="12" fill="#9a6700">3 failed</text>

  <!-- after -->
  <text x="28" y="283" font-size="12.5" fill="#656d76">after</text>
  <rect x="210" y="268" width="470" height="20" rx="3" fill="#eaeef2"/>
  <rect x="210" y="268" width="464" height="20" rx="3" fill="#1a7f37"/>            <!-- 86 pass -->
  <rect x="676" y="268" width="6"   height="20" rx="3" fill="#d1a000"/>            <!-- 1 fail -->
  <text x="220" y="282" font-size="12" font-weight="700" fill="#ffffff">86 passed</text>
  <text x="690" y="282" font-size="12" fill="#9a6700">1 failed</text>

  <!-- footnote -->
  <text x="28" y="322" font-size="11.5" fill="#656d76">C++ ROUTING_UNIT_TEST 53/53 · ROUTING_INTERNAL_TEST 52/52 · EV distance_breaks 5/5. The 1 documented fail = multi-cycle d_min (soft-by-design).</text>
  <text x="28" y="340" font-size="11.5" fill="#656d76">The 1 pre-existing = l1_homberger SetUp() crash — fails identically on stock main, attributed by rebuild-and-compare.</text>
</svg>
