<svg xmlns="http://www.w3.org/2000/svg" width="720" height="270" viewBox="0 0 720 270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="EV distance-breaks adds no measurable cost: solve time 10.08s off vs 10.12s on; gap-to-BKS 0.58% off vs 0.66% on.">
  <rect x="0.5" y="0.5" width="719" height="269" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="28" y="38" font-size="18" font-weight="700" fill="#1f2328">EV distance-breaks — no measurable cost</text>
  <text x="28" y="59" font-size="12.5" fill="#656d76">cuOpt gap-to-BKS methodology · Solomon r107 · H200 · cuOpt 26.10.00 · 10 s budget · feature ON vs OFF</text>

  <!-- metric 1: solve time -->
  <text x="28" y="96" font-size="13" font-weight="700" fill="#1f2328">Solve time (s) — lower is faster</text>
  <!-- scale: 12s -> 430px, x 150..580 -->
  <text x="28" y="120" font-size="12" fill="#656d76">OFF</text>
  <rect x="150" y="108" width="430" height="16" rx="3" fill="#eaeef2"/>
  <rect x="150" y="108" width="361" height="16" rx="3" fill="#57606a"/>
  <text x="590" y="121" font-size="12" font-weight="700" fill="#1f2328">10.08</text>
  <text x="28" y="146" font-size="12" fill="#656d76">ON</text>
  <rect x="150" y="134" width="430" height="16" rx="3" fill="#eaeef2"/>
  <rect x="150" y="134" width="363" height="16" rx="3" fill="#1a7f37"/>
  <text x="590" y="147" font-size="12" font-weight="700" fill="#1f2328">10.12</text>

  <!-- metric 2: gap to BKS -->
  <text x="28" y="184" font-size="13" font-weight="700" fill="#1f2328">Gap to best-known solution (%) — lower is better</text>
  <!-- scale: 5% (cuOpt regression threshold) -> 430px, x 150..580 -->
  <text x="28" y="208" font-size="12" fill="#656d76">OFF</text>
  <rect x="150" y="196" width="430" height="16" rx="3" fill="#eaeef2"/>
  <rect x="150" y="196" width="50" height="16" rx="3" fill="#57606a"/>
  <text x="210" y="209" font-size="12" font-weight="700" fill="#1f2328">0.58%</text>
  <text x="28" y="234" font-size="12" fill="#656d76">ON</text>
  <rect x="150" y="222" width="430" height="16" rx="3" fill="#eaeef2"/>
  <rect x="150" y="222" width="57" height="16" rx="3" fill="#1a7f37"/>
  <text x="217" y="235" font-size="12" font-weight="700" fill="#1f2328">0.66%</text>
  <line x1="580" y1="190" x2="580" y2="244" stroke="#d1a000" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="586" y="215" font-size="10.5" fill="#9a6700">cuOpt 5%</text>
  <text x="586" y="228" font-size="10.5" fill="#9a6700">regr. limit</text>

  <text x="28" y="262" font-size="11.5" fill="#656d76">Same solve time; quality difference (0.08 pp) is well inside noise and far under cuOpt's 5% regression threshold.</text>
</svg>
